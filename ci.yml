name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.10", "3.12", "3.13", "3.14", "3.15"]
        include:
          # Free-threaded build of Python 3.15.
          - os: ubuntu-latest
            python-version: "3.15t"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Run tests
        run: python -m unittest -v
      - name: Run tests with every import lazy (Python 3.15 only)
        if: startsWith(matrix.python-version, '3.15')
        run: python -X lazy_imports=all -m unittest -v