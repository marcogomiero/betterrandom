name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Every minor version: random.Random differs between 3.8, 3.9 and 3.10.
        python-version:
          ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          # Free-threaded build of Python 3.15.
          - os: ubuntu-latest
            python-version: "3.15t"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Run tests
        run: python -m unittest -v
      - name: Run tests with every import lazy (Python 3.15 only)
        if: startsWith(matrix.python-version, '3.15')
        run: python -X lazy_imports=all -m unittest -v
      - name: Run the bias demo
        run: python bias_demo.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and check the package
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*
      - name: Install the wheel and run the command line tool
        run: |
          python -m pip install dist/*.whl
          betterrandom 1 6 -n 3